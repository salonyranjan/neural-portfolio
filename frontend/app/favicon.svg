<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep tech gradient matching a 3D/Node canvas theme -->
    <linearGradient id="neural-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Cyan (React/Next vibe) -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- Indigo/Purple (AWS/Python vibe) -->
    </linearGradient>
  </defs>

  <!-- Dark rounded squircle background for high contrast -->
  <rect width="32" height="32" rx="8" fill="#09090b" />

  <!-- Subtle connecting graph lines representing force-directed nodes -->
  <line x1="8" y1="16" x2="16" y2="10" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  <line x1="16" y1="10" x2="24" y2="16" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
  <line x1="16" y1="10" x2="16" y2="22" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- Node intersections (representing graph vertices) -->
  <circle cx="8" cy="16" r="2" fill="#38bdf8" />
  <circle cx="24" cy="16" r="2" fill="#6366f1" />
  <circle cx="16" cy="22" r="2" fill="#a855f7" />
  <circle cx="16" cy="10" r="2.5" fill="#ffffff" />

  <!-- Bold, legible monogram 'SR' subtly overlaid or integrated -->
  <!-- Designed strictly thick and blocky so it stays readable at 16x16px -->
  <text x="16" y="20.5" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="11px" 
        fill="url(#neural-glow)" 
        text-anchor="middle" 
        letter-spacing="-0.5px">SR</text>
</svg>
